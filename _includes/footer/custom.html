<!-- start custom footer snippets -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.getElementById('scroll-nav');
  if (!nav) return;
  var toggle = nav.querySelector('.scroll-nav__toggle');
  var hero = document.querySelector('.intro-hero');
 
  function closeMenu() {
    nav.classList.remove('is-open');
    toggle.setAttribute('aria-expanded', 'false');
  }
  function onScroll() {
    var threshold = hero ? hero.offsetHeight - 80 : 200;
    var show = window.scrollY > threshold;
    nav.classList.toggle('is-visible', show);
    if (!show) closeMenu();
  }
 
  toggle.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = nav.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  nav.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });
  document.addEventListener('click', function (e) { if (!nav.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
});
</script>
<!-- end custom footer snippets -->
